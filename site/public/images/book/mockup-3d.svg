<svg width="620" height="930" viewBox="0 0 620 930" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="עטיפת הספר מדייטים לאהבה">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3a2f24"/>
      <stop offset="0.5" stop-color="#2b2319"/>
      <stop offset="1" stop-color="#1d1710"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.33" r="0.6">
      <stop offset="0" stop-color="#c56a45" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#c56a45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arcWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eb9163"/>
      <stop offset="1" stop-color="#b25f3d"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="620" height="930" rx="9" fill="url(#ground)"/>
  <rect x="0" y="0" width="620" height="930" rx="9" fill="url(#glow)"/>
  <rect x="0" y="0" width="620" height="930" rx="9" filter="url(#grain)" opacity="0.05"/>

  <!-- רמז לשדרת הספר בקצה הפנימי -->
  <rect x="0" y="0" width="32" height="930" rx="9" fill="url(#spine)"/>

  <rect x="28" y="28" width="564" height="874" rx="5" fill="none" stroke="#c56a45" stroke-opacity="0.42" stroke-width="1.5"/>
  <rect x="37" y="37" width="546" height="856" rx="3" fill="none" stroke="#efe7d8" stroke-opacity="0.12" stroke-width="1"/>

  <text x="310" y="126" text-anchor="middle" fill="#e9dfce" fill-opacity="0.6" font-family="Heebo, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="7">מדריך מעשי · דייטינג וזוגיות</text>

  <g transform="translate(310,318)">
    <circle r="126" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <circle r="104" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <g fill="none" stroke-width="20" stroke-linecap="round">
      <path d="M 7 -90 A 90 90 0 0 0 7 90" stroke="#efe7d8" stroke-opacity="0.9"/>
      <path d="M -7 -90 A 90 90 0 0 1 -7 90" stroke="url(#arcWarm)"/>
    </g>
    <circle cx="7" cy="-90" r="8" fill="#efe7d8"/>
    <circle cx="-7" cy="90" r="8" fill="#eb9163"/>
  </g>

  <text x="310" y="576" text-anchor="middle" fill="#f6efe3" font-family="Heebo, 'Segoe UI', Arial, sans-serif" font-size="106" font-weight="800" letter-spacing="-3">מדייטים</text>
  <text x="310" y="686" text-anchor="middle" fill="#f6efe3" font-family="Heebo, 'Segoe UI', Arial, sans-serif" font-size="106" font-weight="800" letter-spacing="-3">לאהבה</text>

  <line x1="268" y1="736" x2="352" y2="736" stroke="#c56a45" stroke-width="3" stroke-linecap="round"/>

  <text x="310" y="792" text-anchor="middle" fill="#d8cebc" fill-opacity="0.82" font-family="Heebo, 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="500">דייטינג הוא חיפוש. אהבה היא בנייה.</text>

  <g fill="#c56a45" fill-opacity="0.7">
    <circle cx="296" cy="850" r="2.6"/>
    <circle cx="310" cy="850" r="2.6"/>
    <circle cx="324" cy="850" r="2.6"/>
  </g>
</svg>
