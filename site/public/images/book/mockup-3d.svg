<svg width="640" height="900" viewBox="0 0 640 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="עטיפת הספר מדייטים לאהבה">
  <rect x="60" y="30" width="520" height="840" rx="6" fill="#f6f1e8"/>
  <!-- מוטיב: שני חצאי-טבעת שנפגשים עם רווח קטן — מחיפוש לבנייה -->
  <g fill="none" stroke-width="16" stroke-linecap="round" transform="translate(-20,0)">
    <path d="M 346 172 A 72 72 0 0 1 346 316" stroke="#22262b"/>
    <path d="M 334 172 A 72 72 0 0 0 334 316" stroke="#a65c3e"/>
  </g>
  <text x="320" y="452" text-anchor="middle" fill="#22262b" font-family="Heebo, 'Segoe UI', Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-2">מדייטים</text>
  <text x="320" y="544" text-anchor="middle" fill="#22262b" font-family="Heebo, 'Segoe UI', Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-2">לאהבה</text>
  <line x1="252" y1="594" x2="388" y2="594" stroke="#c9bda6" stroke-width="2"/>
  <text x="320" y="640" text-anchor="middle" fill="#5c5f5c" font-family="Heebo, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="500">דייטינג הוא חיפוש. אהבה היא בנייה.</text>
  <text x="320" y="828" text-anchor="middle" fill="#8a8272" font-family="Heebo, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="3">מדריך מעשי לדייטינג ולזוגיות</text>
</svg>
