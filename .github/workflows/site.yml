name: site

# שער CI ראשוני (first-party) לאתר שתחת `site/`.
#
# עד כה לא הייתה לאתר שום בדיקה צד-GitHub: `medayitim-leahava.yml` מסונן
# לנתיב `medayitim-leahava/**` (אפליקציית Next נפרדת), ו-`tests.yml` מריץ
# pytest על קוד ה-Python שבשורש. כלומר הבדיקה היחידה שכיסתה את האתר הייתה
# ה-build של Vercel — ספק חיצוני יחיד, בלי typecheck, בלי lint ובלי בדיקות
# יחידה. הקובץ הזה סוגר את הפער.
#
# מריץ אך ורק את הפקודות שכבר מוגדרות ב-`site/package.json`.
#
# ── למה אין `paths:` באירוע ה-PR ─────────────────────────────────────────────
# הבדיקה הזו מיועדת להיות *required* על `main`. סינון `paths:` ברמת הטריגר
# אינו תואם לכך: PR שאינו נוגע בנתיבים המסוננים לא היה מפעיל את הריצה כלל,
# הבדיקה הנדרשת לעולם לא הייתה מדווחת, ו-GitHub היה משאיר את ה-PR תקוע ב-
# „Expected — waiting for status to be reported” בלי דרך למזג. לכן הטריגר
# תופס *כל* PR ל-`main`, ה-job תמיד קיים ותמיד מדווח, וזיהוי-השינויים עבר
# פנימה אל תוך ה-job: הצעדים היקרים רצים רק כשיש שינוי רלוונטי.
#
# ה-job אינו מדולג ברמת ה-job במכוון. job שמדולג אינו מתנהג כמו בדיקה נדרשת
# שעברה, ולכן הדילוג נעשה ברמת ה*צעדים* בלבד.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

# הרשאות מינימליות: השער רק קורא את הקוד. אינו כותב, אינו מגיב ואינו פורס.
permissions:
  contents: read

# דחיפה חדשה לאותו ענף מבטלת ריצה קודמת שעדיין רצה. `main` מוחרג כדי
# שהריצה שאחרי המיזוג תמיד תושלם ותשאיר סטטוס.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: site

jobs:
  verify:
    # שם הבדיקה שמוגדרת (או תוגדר) כ-required על `main`. אין לשנות אותו:
    # שינוי-שם שובר את ההגדרה בהגנת-הענף בשקט, וה-PR נתקע.
    name: typecheck, lint, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # היסטוריה מלאה כדי ש-`git merge-base` יוכל להשוות בין בסיס ה-PR
          # לראשו. המאגר קטן (7.7MB, ~100 commits) ולכן העלות זניחה, והחלופה
          # — היסטוריה חלקית — הופכת את הזיהוי לשביר בדיוק במקרים שחשובים:
          # ריבוי commits, rebase, וענפים שנדחפו מחדש.
          fetch-depth: 0

      # ── זיהוי שינויים רלוונטיים ────────────────────────────────────────────
      # first-party בלבד: git + הקשר של GitHub, בלי Action צד-שלישי.
      #
      # ההשוואה היא three-dot מול נקודת ההסתעפות (`merge-base`) ולא מול קצה
      # `main` הנוכחי, ולכן היא עונה על „מה ה-PR הזה שינה” גם אחרי rebase, גם
      # כשיש כמה commits, וגם כשה-base התקדם מאז פתיחת ה-PR. אין כאן שימוש
      # ב-`HEAD^`: על אירוע pull_request מה שנבדק הוא commit-מיזוג, ו-`HEAD^`
      # היה תלוי בסדר ההורים שלו.
      #
      # כלל בטיחות: *כל* כשל בזיהוי מפיל אותנו להרצה מלאה, לא לדילוג. עדיף
      # לשלם על ריצה מיותרת מאשר לאשר בשקט PR שלא נבדק.
      - name: Detect site-relevant changes
        id: changes
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Push to ${{ github.ref_name }} — running the full gate unconditionally."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "PR base/head SHA missing from the event payload — running the full gate (fail-safe)."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null); then
            echo "Could not compute merge-base for $BASE_SHA...$HEAD_SHA — running the full gate (fail-safe)."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "merge-base: $MERGE_BASE"
          if ! CHANGED=$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA" 2>/dev/null); then
            echo "git diff failed — running the full gate (fail-safe)."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Files changed by this PR:"
          echo "$CHANGED" | sed 's/^/  /'

          if printf '%s\n' "$CHANGED" \
            | grep -qE '^(site/|\.github/workflows/site\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "==> site-relevant changes found; running the full gate."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "==> no site-relevant changes."
          fi

      # ── המסלול הזול: אין שינוי רלוונטי ─────────────────────────────────────
      # ה-job מסתיים ירוק בלי setup-node, בלי npm ci ובלי בנייה.
      - name: No site-related changes
        if: steps.changes.outputs.relevant != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "No site-related changes; required site CI gate satisfied."

      # ── המסלול המלא: יש שינוי רלוונטי ──────────────────────────────────────
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.relevant == 'true'
        with:
          # next@16 דורש >=20.9.0 ו-vitest@4 דורש ^20 || ^22 || >=24.
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies (npm ci, from site/package-lock.json)
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        if: steps.changes.outputs.relevant == 'true'
        run: npm run typecheck

      - name: Lint (eslint)
        if: steps.changes.outputs.relevant == 'true'
        run: npm run lint

      # בלי VERCEL_ENV במכוון: בדיקות היחידה מנהלות את המשתנה בעצמן
      # (`repositorySelection.test.ts` מוחק ומציב אותו ב-beforeEach/afterEach),
      # וקביעה גלובלית כאן רק הייתה מסתירה את מה שהן בודקות.
      - name: Unit tests (vitest run)
        if: steps.changes.outputs.relevant == 'true'
        run: npm test

      - name: Production build (next build)
        if: steps.changes.outputs.relevant == 'true'
        env:
          # ה-build של Vercel Production רץ עם VERCEL_ENV=production, ובאתר
          # הזה הערך הוא שקובע את מצב האינדוקס: `layout.tsx` פולט
          # `index, follow` רק כשהוא שווה "production", אחרת `noindex, nofollow`.
          # עמודים סטטיים מקבלים את ההחלטה בזמן ה-build, ולכן build בלי
          # המשתנה היה מאמת נתיב-אינדוקס *שונה מהותית* מזה שרץ בפרודקשן.
          VERCEL_ENV: production
          # דומיין קנוני מפורש, כדי שה-build יאמת את אותם canonical/OG/sitemap
          # שהפרודקשן פולט. `resolveSiteUrl()` היה נופל לכתובת הזו גם בלעדיו.
          NEXT_PUBLIC_SITE_URL: https://www.zachi.co.il
        run: npm run build

  # ── E2E: הסוויטה הקיימת של Playwright (Chromium) ─────────────────────────
  #
  # job *נפרד* ובלתי-תלוי ב-`verify`. אין כאן `needs:` במכוון: `verify` הוא
  # הבדיקה הנדרשת על `main`, ו-job נדרש שתלוי ב-job אחר מדולג/כושל אינו מדווח
  # ומשאיר את ה-PR תקוע — בדיוק הכשל שהמבנה הנוכחי בא למנוע. שני ה-jobs רצים
  # במקביל, כל אחד מדווח בעצמו, ואיטיות של אחד אינה מעכבת את השני.
  #
  # שם הבדיקה כאן חדש ואינו נוגע ב-`typecheck, lint, unit, build`.
  #
  # זיהוי-השינויים משוכפל בכוונה במקום להישאב מ-job משותף: איחוד היה מכניס
  # `needs:` לשער הנדרש, וזה בדיוק מה שאסור. עדיף שכפול של צעד bash אחד על
  # פני תלות שמסכנת את הבדיקה הנדרשת.
  e2e:
    name: e2e (playwright chromium)
    runs-on: ubuntu-latest
    # הסוויטה רצה כ-5 דקות; התקנה + בנייה מוסיפות כמה. 30 הוא חסם-בטיחות
    # שמונע job תקוע, לא יעד.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # אותה סמנטיקה בדיוק כמו ב-`verify`: three-dot מול merge-base, וכל כשל
      # בזיהוי מפיל להרצה מלאה ולא לדילוג.
      - name: Detect site-relevant changes
        id: changes
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Push to ${{ github.ref_name }} — running the E2E suite unconditionally."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "PR base/head SHA missing from the event payload — running the E2E suite (fail-safe)."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null); then
            echo "Could not compute merge-base for $BASE_SHA...$HEAD_SHA — running the E2E suite (fail-safe)."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! CHANGED=$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA" 2>/dev/null); then
            echo "git diff failed — running the E2E suite (fail-safe)."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Files changed by this PR:"
          echo "$CHANGED" | sed 's/^/  /'

          if printf '%s\n' "$CHANGED" \
            | grep -qE '^(site/|\.github/workflows/site\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "==> site-relevant changes found; running the E2E suite."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "==> no site-relevant changes."
          fi

      - name: No site-related changes
        if: steps.changes.outputs.relevant != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "No site-related changes; E2E suite not required for this PR."

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies (npm ci, from site/package-lock.json)
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci

      # הבינארי של הדפדפן אינו ב-node_modules ולכן אינו מכוסה ע"י מטמון ה-npm.
      # המפתח נגזר מגרסת @playwright/test שננעלה: שדרוג גרסה מחייב הורדה
      # מחדש, וכל עוד הגרסה זהה ההורדה נחסכת.
      - name: Resolve the locked Playwright version
        if: steps.changes.outputs.relevant == 'true'
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: steps.changes.outputs.relevant == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Chromium בלבד — הסוויטה מגדירה שני projects, ושניהם Chromium.
      # `--with-deps` מתקין את ספריות המערכת שהדפדפן דורש; הוא נדרש גם כשהמטמון
      # פגע, כי חבילות ה-apt אינן חלק מהמטמון.
      - name: Install Chromium for Playwright
        if: steps.changes.outputs.relevant == 'true'
        run: npx playwright install --with-deps chromium

      # ── הרצת הסוויטה ───────────────────────────────────────────────────────
      # השרתים עולים דרך `webServer` שב-`playwright.config.ts`, לא מכאן:
      # Playwright בונה, מפעיל, *ממתין למוכנות ה-URL*, נכשל בבירור אם השרת לא
      # עלה, ומכבה את שני התהליכים בסוף הריצה. ב-CI `reuseExistingServer` הוא
      # false, ולכן אין סיכון להרצה מול שרת ישן.
      #
      # במכוון *ללא* VERCEL_ENV: זו הסביבה שהסוויטה נכתבה מולה. הצבתו כאן
      # הייתה בונה עמודים עם `index, follow` ומגישה אותם תחת ריצה שאינה
      # פרודקשן, ו-`seo-metadata.spec.ts` בודק בדיוק את העקביות הזו — כלומר
      # היינו מייצרים כשל-בדיקה מסביבת ה-CI עצמה. גם `npm run build` שבתוך
      # ה-webServer רץ בלי המשתנה, בדיוק כמו מקומית.
      - name: E2E (playwright test --project=chromium)
        if: steps.changes.outputs.relevant == 'true'
        run: npm run test:e2e -- --project=chromium

      # רק בכישלון: ריצה ירוקה אינה מעלה דבר. ה-trace נוצר בניסיון החוזר
      # (`trace: on-first-retry`), הצילום בכישלון, והדוח מסכם את שניהם.
      - name: Upload Playwright diagnostics
        if: failure() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            site/playwright-report/
            site/test-results/
          retention-days: 7
          if-no-files-found: ignore

# הערות על סודות ועל היקף:
#
# * אין כאן שום סוד ואין צורך באף אחד. `ANTHROPIC_API_KEY` חסר, ולכן
#   ה-Compass נשאר כבוי (`config.ts` בודק את קיום המפתח); `COMPASS_PG_URL`
#   חסר, ולכן בדיקות ה-PG מדלגות על עצמן; `DATABASE_URL` חסר, ולכן
#   `getWaitlistRepository()` מחזיר null בלי לפתוח חיבור. זה נכון גם ל-E2E:
#   הבדיקות מיירטות את /api/compass ואינן קוראות לספק אמיתי.
