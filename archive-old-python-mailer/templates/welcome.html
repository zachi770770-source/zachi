<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 40px auto; background: #ffffff;
                 border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .header { background: #0078d4; padding: 32px; text-align: center; }
    .header h1 { color: #ffffff; margin: 0; font-size: 24px; }
    .body { padding: 32px; color: #333333; line-height: 1.6; }
    .body h2 { color: #0078d4; }
    .footer { background: #f0f0f0; padding: 16px; text-align: center;
              font-size: 12px; color: #888888; }
    .btn { display: inline-block; margin-top: 24px; padding: 12px 28px;
           background: #0078d4; color: #ffffff; text-decoration: none;
           border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>ברוך הבא!</h1>
    </div>
    <div class="body">
      <h2>שלום {{ name }},</h2>
      <p>{{ message }}</p>
      <p>אנו שמחים שהצטרפת אלינו ומקווים שתהנה מהשירות.</p>
      {% if action_url is defined %}
      <a class="btn" href="{{ action_url }}">לחץ כאן להתחלה</a>
      {% endif %}
    </div>
    <div class="footer">
      © 2026 · נשלח אוטומטית
    </div>
  </div>
</body>
</html>
